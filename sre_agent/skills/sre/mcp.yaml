# Default MCP server — OpenShift MCP Server
# https://github.com/openshift/openshift-mcp-server
#
# In-cluster: connects via SSE to the MCP server pod (deployed via Helm)
# Local dev: uses npx stdio (requires Node.js installed)
#
# Set PULSE_MCP_URL env var to override the server URL.

server:
  url: "${PULSE_MCP_URL:-http://pulse-openshift-sre-agent-mcp:8081}"
  transport: sse
  auth:
    type: service_account

toolsets:
  - core
  - helm
  - observability
  # - tekton        # enable if cluster has Tekton
  # - kubevirt      # enable if cluster has KubeVirt

# Tool names that mutate cluster state. Pulse cannot introspect MCP tool
# semantics, so any tool that writes MUST be listed here explicitly to get
# the same confirmation gate as native write tools (e.g. scale_deployment).
# Defense in depth: the MCP server pod is also started with --read-only
# (see chart/templates/mcp-server.yaml), but that is an external dependency's
# behavior, not something Pulse can verify at runtime -- list write tools here
# too so the confirmation gate holds even if that flag is ever removed or a
# non-Pulse-managed MCP server (PULSE_MCP_URL override) doesn't honor it.
write_tools:
  - helm_install
  - helm_uninstall

# Map MCP tool output to Pulse UI components
tool_renderers:
  helm_list:
    kind: data_table
    parser: json
    columns: [name, namespace, revision, status, chart, app_version]
  helm_install:
    kind: status_list
    parser: key_value
  helm_uninstall:
    kind: key_value
    parser: key_value
  alertmanager_alerts:
    kind: status_list
    parser: json
    item_mapping:
      label: "{{alertname}}"
      status: "{{state}}"
      detail: "{{description}}"
  prometheus_query:
    kind: key_value
    parser: json
  resources_list:
    kind: data_table
    parser: json
  pods_list:
    kind: data_table
    parser: json
