# Crashloop Resolution Plan Template
# Handles pods stuck in CrashLoopBackOff state

id: crashloop-resolution-v1
name: Crashloop Resolution
incident_type: crashloop
max_total_duration: 1200  # phase budgets sum to 1140s; 900 could truncate verify

# Timeouts and contracts tuned against 203 production runs. triage failed 103
# of them and verify 97 — almost all structural: a 120s ceiling on phases whose
# measured skill runs take 55–204s on this cluster, and a timeout is never
# retried, so half of all plan executions aborted at the first phase.
# Contracts are trimmed to load-bearing fields: declaring nice-to-have output
# (exit_code, restart_count_after) turned its routine absence into a 'partial'
# verdict, drowning the signal the judge exists for.
phases:
  - id: triage
    skill_name: sre
    required: true
    timeout_seconds: 300
    produces: [severity, affected_pods, namespace]

  - id: diagnose
    skill_name: sre
    required: true
    depends_on: [triage]
    timeout_seconds: 300
    produces: [root_cause, root_cause_category, confidence]

  - id: remediate
    skill_name: sre
    required: false
    depends_on: [diagnose]
    timeout_seconds: 300
    approval_required: false
    produces: [fix_applied, fix_type]

  - id: verify
    skill_name: sre
    required: true
    depends_on: [remediate]
    timeout_seconds: 240
    runs: always
    produces: [pod_status, resolution_confirmed]
