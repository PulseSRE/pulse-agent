apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-agent
    spec:
      containers:
        - name: pulse-agent
          image: pulse-agent:1
          ports:
            - containerPort: 8080
