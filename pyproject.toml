[project]
name = "openshift-sre-agent"
version = "2.16.1"
description = "An AI-powered OpenShift SRE agent using Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic[vertex]>=0.115.0",
    "kubernetes>=35.0.0",
    "rich>=15.0.0",
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "websockets>=17.0",
    "pydantic-settings>=2.13.0",
    "psycopg2-binary>=2.9.11",
    "python-json-logger>=3.0.0",
    "structlog>=26.0.0",
    "asyncpg>=0.30.0",
    "kubernetes_asyncio>=35.0.0",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "pytest-timeout>=2.3.0", "ruff>=0.4.0", "mypy>=1.0", "types-PyYAML>=6.0"]

[project.scripts]
sre-agent = "sre_agent.main:main"
pulse-agent-api = "sre_agent.serve:main"
pulse-agent-eval = "sre_agent.evals.cli:main"
pulse-agent-eval-outcomes = "sre_agent.evals.outcomes_cli:main"
pulse-agent-eval-weekly-digest = "sre_agent.evals.weekly_digest_cli:main"

[tool.setuptools.packages.find]
include = ["sre_agent*"]

[tool.setuptools.package-data]
"sre_agent.evals.scenarios_data" = ["*.json"]
"sre_agent.evals.fixtures" = ["*.json"]
"sre_agent.evals.baselines" = ["*.json"]
"sre_agent.skills" = ["**/*.md", "**/*.yaml", "**/*.yml"]
"sre_agent.plan_templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A hung test used to be invisible: the suite normally finishes in ~1-2 minutes,
# but when it stopped finishing, `pytest -q` had flushed no output by the time
# CI's 15-minute step cap killed the job, so nothing identified the culprit.
# Fail the individual test instead, and name it.
#
# timeout_method = "thread" rather than the default "signal": signal-based
# timeouts cannot interrupt a thread blocked in C code (a blocking socket read
# inside psycopg2, say), which is the most likely shape of a hang here. The
# thread method also dumps every thread's stack on expiry, which is the part
# that actually tells you where it stopped.
timeout = 120
timeout_method = "thread"
# Dump all thread stacks if the whole session wedges somewhere pytest-timeout
# cannot see (collection, fixture teardown, interpreter shutdown).
faulthandler_timeout = 300

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # import not at top (used for circular import workarounds)
    "B008",   # function call in default arg (used by FastAPI Depends)
    "B904",   # raise from in except (not always appropriate)
    "B905",   # zip without strict (Python 3.10+)
    "SIM102", # nested if (readability preference)
    "SIM105", # contextlib.suppress (readability preference)
    "SIM108", # ternary operator (readability preference)
    "SIM117", # nested with (readability preference in tests)
    "TC001",  # move app imports to TYPE_CHECKING block (too pedantic)
    "TC003",  # move stdlib imports to TYPE_CHECKING block (too pedantic)
    "RUF005", # unpacking instead of concatenation (readability preference)
    "RUF006", # asyncio.create_task without storing reference (intentional fire-and-forget)
    "B023",   # function definition does not bind loop variable (false positive for closures)
    "N806",   # variable in function should be lowercase (used for local constants)
]

[tool.ruff.lint.isort]
known-first-party = ["sre_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
# Skills excluded: directory names contain hyphens (capacity-planner, view-designer, etc.)
# which are invalid Python package names. Skills are loaded dynamically by skill_loader.py.
exclude = ["sre_agent/skills/"]
