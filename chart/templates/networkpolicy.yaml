{{- if and .Values.rbac.create (not .Values.networkPolicy.disabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    - Ingress
  ingress:
    # Allow WebSocket/HTTP traffic from the Pulse frontend on port 8080 only.
    # Without this pod selector, the rule has no `from:` and Kubernetes
    # NetworkPolicy semantics treat that as "allow from any pod in any
    # namespace" — i.e. no restriction at all, letting anything on the
    # cluster network reach the agent directly and bypass the OAuth
    # proxy/nginx trust boundary that sets X-Forwarded-User/-Access-Token.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.uiPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    # HTTPS (cloud APIs, OAuth, Anthropic)
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
        port: 443
    # Kubernetes API
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
        port: 6443
    # PostgreSQL (in-namespace)
    - to:
      - podSelector:
          matchLabels:
            app: {{ include "sre-agent.fullname" . }}-postgresql
      ports:
      - protocol: TCP
        port: 5432
    # MCP server (in-namespace)
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: mcp-server
      ports:
      - protocol: TCP
        port: 8081
{{- end }}
