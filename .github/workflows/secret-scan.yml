name: Secret Scan

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # A pull request is judged on its own commits only. Without --log-opts,
      # gitleaks runs `git log --all`, and with fetch-depth 0 that is every
      # branch fetched, so one branch's false positive failed every PR.
      # On pull_request the checkout is refs/pull/N/merge (the PR merged into
      # main), so origin/<base>..HEAD is the PR's commits plus that merge.
      - name: Run gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          range="origin/${BASE_REF}..HEAD"
          echo "Scanning ${range}: $(git rev-list --count "${range}") commit(s)"
          git log --oneline "${range}"
          gitleaks detect --source . --verbose --redact --log-opts="${range}"

      # push to main and the merge queue keep the full-history scan, so
      # nothing that lands on main goes unscanned.
      - name: Run gitleaks (full history)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --verbose --redact
