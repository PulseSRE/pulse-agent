name: Secret Scan

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # A pull request is judged on its own commits only. Without --log-opts,
      # gitleaks runs `git log --all`, and with fetch-depth 0 that is every
      # branch fetched, so one branch's false positive failed every PR.
      # On pull_request the checkout is refs/pull/N/merge (the PR merged into
      # main), so origin/<base>..HEAD is the PR's commits plus that merge.
      # An empty range, or one git cannot resolve, fails the job rather than
      # passing on a scan of nothing.
      - name: Run gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          range="origin/${BASE_REF}..HEAD"
          n="$(git rev-list --count "$range")"
          [ "$n" -gt 0 ] || { echo "::error::empty range $range"; exit 1; }
          echo "Scanning ${range}: ${n} commit(s)"
          git log --oneline "${range}"
          gitleaks detect --source . --verbose --redact --log-opts="${range}"

      # The merge queue and push to main scan the whole history of HEAD (the
      # commit being landed, or main itself), and no other fetched branch, so
      # a false positive on an unrelated branch can neither block the queue
      # nor turn main red. HEAD's history contains every commit on main.
      #
      # This workflow runs from the PR's own copy, so a PR that edits it or
      # .gitleaksignore can change what its own scan checks. .github/CODEOWNERS
      # names an owner for both; that only blocks a merge when the branch
      # requires code owner review.
      - name: Run gitleaks (history of HEAD)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          n="$(git rev-list --count HEAD)"
          [ "$n" -gt 0 ] || { echo "::error::empty history at HEAD"; exit 1; }
          echo "Scanning HEAD $(git rev-parse --short HEAD): ${n} commit(s)"
          gitleaks detect --source . --verbose --redact --log-opts="HEAD"
